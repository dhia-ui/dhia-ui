</g></g><g style="--sh:340px"><rect x="772" y="82" width="436" height="2" fill="#2ee2f0" opacity=".8" style="animation:scan 4.5s ease-in-out infinite;--sh:396px"/></g><text x="784" y="472" font-size="11" letter-spacing="2" font-weight="700" fill="#e7ecf7">SHELL.SH</text><text x="1196" y="472" font-size="10" letter-spacing="1.5" text-anchor="end" class="mute">TUNISIA · 60FPS · LOOP</text><rect x="784" y="480" width="412" height="3" rx="1.5" fill="#22305a"/><rect x="784" y="480" width="150" height="3" rx="1.5" fill="url(#gname)"><animate attributeName="width" values="20;412;20" dur="9s" repeatCount="indefinite"/></rect>
