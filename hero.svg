<text x="80" y="478" font-size="24" font-weight="700" fill="#2ee2f0">12</text><text x="80" y="500" font-size="10" letter-spacing="1.5" class="mute">PUBLIC REPOS</text></g><g class="fu" style="animation-delay:1.12s"><rect x="196" y="448" width="160" height="64" rx="12" fill="#0e1426" stroke="#22305a"/>
