<text x="384" y="478" font-size="24" font-weight="700" fill="#ff7a1a">#13</text><text x="384" y="500" font-size="10" letter-spacing="1.5" class="mute">VALENTINECTF · NATIONAL</text></g><g class="fu" style="animation-delay:1.4s"><rect x="570" y="448" width="150" height="64" rx="12" fill="#2fd48a" fill-opacity=".08" stroke="#2fd48a" stroke-opacity=".6"/>
<circle cx="590" cy="472" r="4" fill="#2fd48a" class="pulse"/><text x="604" y="476" font-size="11" letter-spacing="1.5" font-weight="700" fill="#2fd48a">OPEN TO</text>
<text x="586" y="498" font-size="11" letter-spacing="1.5" font-weight="700" fill="#2fd48a">OPPORTUNITIES</text></g><rect x="760" y="70" width="460" height="420" rx="18" fill="url(#gcard)" stroke="#22305a"/><g stroke="#ff7a1a" stroke-width="2" fill="none" stroke-linecap="round" opacity=".9"><path d="M748 92V58H782"/><path d="M1198 58H1232V92"/><path d="M748 468V502H782"/><path d="M1198 502H1232V468"/></g><g class="float"><circle cx="990" cy="268" r="180.0" fill="url(#glowA)" class="pulse"/>
<g transform="translate(990 268) scale(1.2)">
 <g class="spin" opacity=".9"><circle r="118" fill="none" stroke="#2ee2f0" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 9"/></g>
 <g class="spinr"><circle r="136" fill="none" stroke="#c48cfc" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="40 22"/></g>
