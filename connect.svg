<rect x="654" y="180" width="40" height="40" rx="10" fill="#2ee2f0" fill-opacity=".14"/><circle cx="674" cy="200" r="6" fill="#2ee2f0" class="pulse"/>
<text x="708" y="196" font-size="15" font-weight="700" fill="#e7ecf7" class="sans">GitHub</text><text x="708" y="216" font-size="11.5" class="mute">@dhia-ui</text></g><g class="fu" style="animation-delay:0.42s"><rect x="930" y="164" width="276" height="72" rx="12" fill="#0e1426" stroke="#ff7a1a" stroke-opacity=".55"/>
<rect x="944" y="180" width="40" height="40" rx="10" fill="#ff7a1a" fill-opacity=".14"/><circle cx="964" cy="200" r="6" fill="#ff7a1a" class="pulse"/>
<text x="998" y="196" font-size="15" font-weight="700" fill="#e7ecf7" class="sans">Email</text><text x="998" y="216" font-size="11.5" class="mute">dhiaguetiti@gmail.com</text></g><g class="fu" style="animation-delay:0.54s"><rect x="640" y="250" width="276" height="72" rx="12" fill="#0e1426" stroke="#c48cfc" stroke-opacity=".55"/>
<rect x="654" y="266" width="40" height="40" rx="10" fill="#c48cfc" fill-opacity=".14"/><circle cx="674" cy="286" r="6" fill="#c48cfc" class="pulse"/>
<text x="708" y="282" font-size="15" font-weight="700" fill="#e7ecf7" class="sans">LinkedIn</text><text x="708" y="302" font-size="11.5" class="mute">in/guetiti-dhia</text></g><g class="fu" style="animation-delay:0.6599999999999999s"><rect x="930" y="250" width="276" height="72" rx="12" fill="#0e1426" stroke="#2fd48a" stroke-opacity=".55"/>
<rect x="944" y="266" width="40" height="40" rx="10" fill="#2fd48a" fill-opacity=".14"/><circle cx="964" cy="286" r="6" fill="#2fd48a" class="pulse"/>
<text x="998" y="282" font-size="15" font-weight="700" fill="#e7ecf7" class="sans">Instagram</text><text x="998" y="302" font-size="11.5" class="mute">@dhia_guetiti</text></g><text x="640" y="366" font-size="12" class="mute"><tspan fill="#ff7a1a">◆</tspan> Open to freelance, collabs and full-time roles</text>
</svg>
