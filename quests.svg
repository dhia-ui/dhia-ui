<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Missions — experience and projects"><title>Missions — experience and projects</title><desc>Sotunol platform, API security audit, ANPR, Radio ISTIC portal and Sawarni.</desc>
<defs>
<linearGradient id="gname" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e11d34"/></linearGradient>
<linearGradient id="gcard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0e18"/><stop offset="1" stop-color="#120a12"/></linearGradient>
<linearGradient id="gline" x1="0" x2="1"><stop offset="0" stop-color="#e11d34" stop-opacity=".95"/><stop offset=".5" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a1a" stop-opacity=".95"/></linearGradient>
<radialGradient id="glowR" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e11d34" stop-opacity=".4"/><stop offset="1" stop-color="#e11d34" stop-opacity="0"/></radialGradient>
<radialGradient id="glowV" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".05"/></pattern>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.sans{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;font-weight:700} .sans5{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;font-weight:500}
.mute{fill:#a58e98}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(var(--sh,200px));opacity:0}}
@keyframes beam{0%,100%{opacity:.05}50%{opacity:.14}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}100%{transform:translate(var(--dx,20px),-260px);opacity:0}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both} .fi{animation:fadeIn .8s ease both}
.blink{animation:blink 1s steps(1) infinite} .float{animation:float 5s ease-in-out infinite} .pulse{animation:pulse 2.4s ease-in-out infinite}
.ember{animation:rise 7s linear infinite}
.role{opacity:0}
@media (prefers-reduced-motion:reduce){.fu,.fi,.blink,.float,.pulse,.role,.beam,.scanl,.ember{animation:none!important}.role{opacity:0}.role.r0{opacity:1}.beam{opacity:.09}.scanl,.ember{opacity:0}}

</style>
</defs>
<rect width="1280" height="640" rx="22" fill="#07040a"/><rect width="1280" height="640" rx="22" fill="url(#dots)"/>
<rect x="1" y="1" width="1278" height="638" rx="21" fill="none" stroke="url(#gline)" stroke-width="1.5"/><text x="64" y="70" font-size="12" letter-spacing="3" font-weight="700" fill="#ff7a1a">// MISSIONS</text><text x="64" y="114" font-size="36" class="sans" fill="#f6eef0">Quests I’ve completed</text><text x="1216" y="70" font-size="10" letter-spacing="2" text-anchor="end" class="mute">2024 → 2026</text><g class="fu" style="animation-delay:0.2s"><rect x="48" y="140" width="596" height="238" rx="16" fill="url(#gcard)" stroke="#ff7a1a" stroke-opacity=".55"/><rect x="48" y="158" width="4" height="202" rx="2" fill="#ff7a1a"/><text x="74" y="170" font-size="10.5" letter-spacing="2" font-weight="700" fill="#ff7a1a">S-RANK · INDUSTRIAL CLIENT</text><text x="622" y="170" font-size="11" text-anchor="end" class="mute">2025</text><text x="74" y="200" font-size="19" class="sans" fill="#f6eef0">Full-Stack &amp; AI Developer — Sotunol</text><text x="74" y="220" font-size="11.5" class="mute" font-style="italic">Tunis · industrial collaboration project</text><text x="74" y="248" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#ff7a1a">▸ </tspan>Production microservices web platform (React, FastAPI)</text><text x="74" y="268" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#ff7a1a">▸ </tspan>Trained &amp; deployed 3 AI models: cheques, documents, invoices</text><text x="74" y="288" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#ff7a1a">▸ </tspan>EasyOCR platform-wide · interactive national POS map</text><text x="74" y="308" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#ff7a1a">▸ </tspan>PostgreSQL lifecycle: soft/hard delete, full restore</text><rect x="74" y="342" width="58" height="24" rx="7" fill="#ff7a1a" fill-opacity=".12" stroke="#ff7a1a" stroke-opacity=".5"/><text x="103" y="358" font-size="10.5" text-anchor="middle" fill="#f6eef0">React</text><rect x="140.0" y="342" width="73" height="24" rx="7" fill="#ff7a1a" fill-opacity=".12" stroke="#ff7a1a" stroke-opacity=".5"/><text x="177" y="358" font-size="10.5" text-anchor="middle" fill="#f6eef0">FastAPI</text><rect x="221.2" y="342" width="96" height="24" rx="7" fill="#ff7a1a" fill-opacity=".12" stroke="#ff7a1a" stroke-opacity=".5"/><text x="269" y="358" font-size="10.5" text-anchor="middle" fill="#f6eef0">PostgreSQL</text><rect x="325.2" y="342" width="73" height="24" rx="7" fill="#ff7a1a" fill-opacity=".12" stroke="#ff7a1a" stroke-opacity=".5"/><text x="362" y="358" font-size="10.5" text-anchor="middle" fill="#f6eef0">EasyOCR</text><text x="620" y="332" font-size="40" font-weight="700" text-anchor="end" fill="#ff7a1a">3</text><text x="620" y="352" font-size="9.5" letter-spacing="1.5" text-anchor="end" class="mute">AI MODELS</text></g><g class="fu" style="animation-delay:0.35s"><rect x="656" y="140" width="576" height="238" rx="16" fill="url(#gcard)" stroke="#e11d34" stroke-opacity=".55"/><rect x="656" y="158" width="4" height="202" rx="2" fill="#e11d34"/><text x="682" y="170" font-size="10.5" letter-spacing="2" font-weight="700" fill="#e11d34">S-RANK · FINAL-YEAR PROJECT</text><text x="1210" y="170" font-size="11" text-anchor="end" class="mute">2026</text><text x="682" y="200" font-size="19" class="sans" fill="#f6eef0">API Security Audit &amp; Hardening — GT Consulting</text><text x="682" y="220" font-size="11.5" class="mute" font-style="italic">PFE · ISTIC · Borj Cédria</text><text x="682" y="248" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#e11d34">▸ </tspan>Full pentest of a Flask REST API (OWASP API Top 10)</text><text x="682" y="268" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#e11d34">▸ </tspan>Nmap · FFUF · Nikto · Burp · ZAP · SQLMap · Hydra · JWT Tool</text><text x="682" y="288" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#e11d34">▸ </tspan>Bandit + pip-audit, Docker hardening, PyArmor obfuscation</text><text x="682" y="308" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#e11d34">▸ </tspan>Built a remediation-tracking security dashboard</text><rect x="682" y="342" width="58" height="24" rx="7" fill="#e11d34" fill-opacity=".12" stroke="#e11d34" stroke-opacity=".5"/><text x="711" y="358" font-size="10.5" text-anchor="middle" fill="#f6eef0">Flask</text><rect x="748.0" y="342" width="66" height="24" rx="7" fill="#e11d34" fill-opacity=".12" stroke="#e11d34" stroke-opacity=".5"/><text x="781" y="358" font-size="10.5" text-anchor="middle" fill="#f6eef0">Docker</text><rect x="821.6" y="342" width="50" height="24" rx="7" fill="#e11d34" fill-opacity=".12" stroke="#e11d34" stroke-opacity=".5"/><text x="847" y="358" font-size="10.5" text-anchor="middle" fill="#f6eef0">Burp</text><rect x="880.0" y="342" width="66" height="24" rx="7" fill="#e11d34" fill-opacity=".12" stroke="#e11d34" stroke-opacity=".5"/><text x="913" y="358" font-size="10.5" text-anchor="middle" fill="#f6eef0">SQLMap</text><text x="1208" y="332" font-size="40" font-weight="700" text-anchor="end" fill="#e11d34">14/134</text><text x="1208" y="352" font-size="9.5" letter-spacing="1.5" text-anchor="end" class="mute">VULNS VALIDATED</text></g><g class="fu" style="animation-delay:0.5s"><rect x="48" y="394" width="396" height="214" rx="16" fill="url(#gcard)" stroke="#8b5cf6" stroke-opacity=".55"/><rect x="48" y="412" width="4" height="178" rx="2" fill="#8b5cf6"/><text x="74" y="424" font-size="10.5" letter-spacing="2" font-weight="700" fill="#8b5cf6">A-RANK · COMPUTER VISION</text><text x="422" y="424" font-size="11" text-anchor="end" class="mute">2026</text><text x="74" y="454" font-size="19" class="sans" fill="#f6eef0">Tunisian ANPR — real time</text><text x="74" y="474" font-size="11.5" class="mute" font-style="italic">licence-plate recognition</text><text x="74" y="502" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#8b5cf6">▸ </tspan>Detection → OCR → structured data pipeline</text><text x="74" y="522" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#8b5cf6">▸ </tspan>Real-time live-video inference</text><rect x="74" y="572" width="50" height="24" rx="7" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".5"/><text x="99" y="588" font-size="10.5" text-anchor="middle" fill="#f6eef0">YOLO</text><rect x="132.4" y="572" width="66" height="24" rx="7" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".5"/><text x="165" y="588" font-size="10.5" text-anchor="middle" fill="#f6eef0">OpenCV</text><rect x="206.0" y="572" width="73" height="24" rx="7" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".5"/><text x="243" y="588" font-size="10.5" text-anchor="middle" fill="#f6eef0">EasyOCR</text></g><g class="fu" style="animation-delay:0.65s"><rect x="456" y="394" width="396" height="214" rx="16" fill="url(#gcard)" stroke="#38bdf8" stroke-opacity=".55"/><rect x="456" y="412" width="4" height="178" rx="2" fill="#38bdf8"/><text x="482" y="424" font-size="10.5" letter-spacing="2" font-weight="700" fill="#38bdf8">A-RANK · FULL-STACK</text><text x="830" y="424" font-size="11" text-anchor="end" class="mute">2026</text><text x="482" y="454" font-size="19" class="sans" fill="#f6eef0">Radio ISTIC Member Portal</text><text x="482" y="474" font-size="11.5" class="mute" font-style="italic">content sharing &amp; coordination</text><text x="482" y="502" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#38bdf8">▸ </tspan>Node.js / MongoDB REST backend</text><text x="482" y="522" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#38bdf8">▸ </tspan>Members, sharing, real-time collab</text><rect x="482" y="572" width="73" height="24" rx="7" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="519" y="588" font-size="10.5" text-anchor="middle" fill="#f6eef0">Next.js</text><rect x="563.2" y="572" width="73" height="24" rx="7" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="600" y="588" font-size="10.5" text-anchor="middle" fill="#f6eef0">Node.js</text><rect x="644.4000000000001" y="572" width="73" height="24" rx="7" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="681" y="588" font-size="10.5" text-anchor="middle" fill="#f6eef0">MongoDB</text></g><g class="fu" style="animation-delay:0.8s"><rect x="864" y="394" width="368" height="214" rx="16" fill="url(#gcard)" stroke="#fbbf24" stroke-opacity=".55"/><rect x="864" y="412" width="4" height="178" rx="2" fill="#fbbf24"/><text x="890" y="424" font-size="10.5" letter-spacing="2" font-weight="700" fill="#fbbf24">B-RANK · FROM SCRATCH</text><text x="1210" y="424" font-size="11" text-anchor="end" class="mute">2024</text><text x="890" y="454" font-size="19" class="sans" fill="#f6eef0">Sawarni</text><text x="890" y="474" font-size="11.5" class="mute" font-style="italic">end-to-end web application</text><text x="890" y="502" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#fbbf24">▸ </tspan>Angular front · PHP back · MySQL</text><text x="890" y="522" font-size="12" fill="#f6eef0" opacity=".9"><tspan fill="#fbbf24">▸ </tspan>REST APIs, user auth, responsive UI</text><rect x="890" y="572" width="73" height="24" rx="7" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="927" y="588" font-size="10.5" text-anchor="middle" fill="#f6eef0">Angular</text><rect x="971.2" y="572" width="43" height="24" rx="7" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="993" y="588" font-size="10.5" text-anchor="middle" fill="#f6eef0">PHP</text><rect x="1022.0" y="572" width="58" height="24" rx="7" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="1051" y="588" font-size="10.5" text-anchor="middle" fill="#f6eef0">MySQL</text></g>
