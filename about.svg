<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="My way — what I build"><title>My way — what I build</title><desc>What I build: interfaces, secure APIs, applied AI.</desc>
<defs>
<linearGradient id="gname" x1="0" x2="1"><stop offset="0" stop-color="#2ee2f0"/><stop offset="1" stop-color="#c48cfc"/></linearGradient>
<linearGradient id="gcard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a31"/><stop offset="1" stop-color="#0e1426"/></linearGradient>
<linearGradient id="gline" x1="0" x2="1"><stop offset="0" stop-color="#2ee2f0" stop-opacity=".9"/><stop offset=".5" stop-color="#c48cfc" stop-opacity=".5"/><stop offset="1" stop-color="#2ee2f0" stop-opacity=".9"/></linearGradient>
<radialGradient id="glowA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2ee2f0" stop-opacity=".35"/><stop offset="1" stop-color="#2ee2f0" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c48cfc" stop-opacity=".30"/><stop offset="1" stop-color="#c48cfc" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.sans{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;font-weight:700}
.sans5{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;font-weight:500}
.mute{fill:#8a97b5}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(var(--sh,200px));opacity:0}}
@keyframes beam{0%,100%{opacity:.05}50%{opacity:.13}}
@keyframes dash{to{stroke-dashoffset:-60}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.fi{animation:fadeIn .7s ease both}
.blink{animation:blink 1s steps(1) infinite}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spinr 36s linear infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}

</style>
</defs>
<rect width="1280" height="470" rx="22" fill="#070b1a"/>
<rect width="1280" height="470" rx="22" fill="url(#dots)"/>
<rect x="1" y="1" width="1278" height="468" rx="21" fill="none" stroke="url(#gline)" stroke-width="1.5"/><g transform="translate(60 60)"><rect width="420" height="350" rx="16" fill="#080d1e" stroke="#22305a"/>
<rect width="420" height="40" rx="16" fill="#121a31"/><rect y="24" width="420" height="16" fill="#121a31"/>
<circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="46" cy="20" r="6" fill="#febc2e"/><circle cx="68" cy="20" r="6" fill="#28c840"/>
<text x="210" y="25" font-size="11" text-anchor="middle" class="mute">secure_api.py</text><text x="24" y="78" font-size="13.5" class="fu" style="animation-delay:0.3s" xml:space="preserve"><tspan fill="#c48cfc" xml:space="preserve">from</tspan><tspan fill="#e7ecf7" xml:space="preserve"> fastapi </tspan><tspan fill="#c48cfc" xml:space="preserve">import</tspan><tspan fill="#e7ecf7" xml:space="preserve"> Depends</tspan></text><text x="24" y="106" font-size="13.5" class="fu" style="animation-delay:0.44999999999999996s" xml:space="preserve"><tspan fill="#8a97b5" xml:space="preserve"># every route is authenticated</tspan></text><text x="24" y="134" font-size="13.5" class="fu" style="animation-delay:0.6s" xml:space="preserve"><tspan fill="#c48cfc" xml:space="preserve">@router</tspan><tspan fill="#e7ecf7" xml:space="preserve">.get(</tspan><tspan fill="#2fd48a" xml:space="preserve">&quot;/reports&quot;</tspan><tspan fill="#e7ecf7" xml:space="preserve">)</tspan></text><text x="24" y="162" font-size="13.5" class="fu" style="animation-delay:0.75s" xml:space="preserve"><tspan fill="#c48cfc" xml:space="preserve">async def</tspan><tspan fill="#2ee2f0" xml:space="preserve"> reports</tspan><tspan fill="#e7ecf7" xml:space="preserve">(user=</tspan><tspan fill="#c48cfc" xml:space="preserve">Depends</tspan><tspan fill="#e7ecf7" xml:space="preserve">(auth)):</tspan></text><text x="24" y="190" font-size="13.5" class="fu" style="animation-delay:0.8999999999999999s" xml:space="preserve"><tspan fill="#e7ecf7" xml:space="preserve">    </tspan><tspan fill="#c48cfc" xml:space="preserve">if not</tspan><tspan fill="#e7ecf7" xml:space="preserve"> user.</tspan><tspan fill="#2ee2f0" xml:space="preserve">can</tspan><tspan fill="#e7ecf7" xml:space="preserve">(</tspan><tspan fill="#2fd48a" xml:space="preserve">&quot;read&quot;</tspan><tspan fill="#e7ecf7" xml:space="preserve">):</tspan></text><text x="24" y="218" font-size="13.5" class="fu" style="animation-delay:1.05s" xml:space="preserve"><tspan fill="#e7ecf7" xml:space="preserve">        </tspan><tspan fill="#c48cfc" xml:space="preserve">raise</tspan><tspan fill="#2ee2f0" xml:space="preserve"> Forbidden</tspan><tspan fill="#e7ecf7" xml:space="preserve">()</tspan></text><text x="24" y="246" font-size="13.5" class="fu" style="animation-delay:1.2s" xml:space="preserve"><tspan fill="#e7ecf7" xml:space="preserve">    </tspan><tspan fill="#c48cfc" xml:space="preserve">return</tspan><tspan fill="#e7ecf7" xml:space="preserve"> </tspan><tspan fill="#2ee2f0" xml:space="preserve">audit</tspan><tspan fill="#e7ecf7" xml:space="preserve">(await db.fetch())</tspan></text><rect x="24" y="282" width="10" height="18" fill="#2ee2f0" class="blink"/><g transform="translate(340 292) scale(.8)"><g class="float"><path d="M0 -44 L38 -30 V4 C38 28 20 42 0 52 C-20 42 -38 28 -38 4 V-30 Z" fill="#070b1a" stroke="url(#gname)" stroke-width="3"/><path d="M-14 4 L-4 14 L16 -10" fill="none" stroke="#2fd48a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><text x="560" y="84" font-size="12" letter-spacing="3" font-weight="700" fill="#ff7a1a">// MY WAY</text><text x="560" y="134" font-size="38" class="sans" fill="#e7ecf7">Build it secure — then ship it</text><text x="560" y="168" font-size="15" class="mute sans5">Full-stack &amp; AI backend engineer by day, security researcher by night.</text><g class="fu" style="animation-delay:0.5s"><rect x="560" y="214" width="46" height="46" rx="11" fill="#2ee2f0" fill-opacity=".12" stroke="#2ee2f0" stroke-opacity=".6"/>
<circle cx="583" cy="237" r="6" fill="#2ee2f0" class="pulse"/>
<text x="624" y="233" font-size="16" class="sans" fill="#e7ecf7">Interfaces that feel alive</text>
<text x="624" y="253" font-size="12" class="mute">Clean, responsive React + Tailwind frontends, with Three.js where it earns its place</text></g><g class="fu" style="animation-delay:0.65s"><rect x="560" y="280" width="46" height="46" rx="11" fill="#c48cfc" fill-opacity=".12" stroke="#c48cfc" stroke-opacity=".6"/>
<circle cx="583" cy="303" r="6" fill="#c48cfc" class="pulse"/>
<text x="624" y="299" font-size="16" class="sans" fill="#e7ecf7">Backends that hold up</text>
<text x="624" y="319" font-size="12" class="mute">FastAPI services, PostgreSQL and clean architecture built for production</text></g><g class="fu" style="animation-delay:0.8s"><rect x="560" y="346" width="46" height="46" rx="11" fill="#2fd48a" fill-opacity=".12" stroke="#2fd48a" stroke-opacity=".6"/>
<circle cx="583" cy="369" r="6" fill="#2fd48a" class="pulse"/>
<text x="624" y="365" font-size="16" class="sans" fill="#e7ecf7">AI that does real work</text>
<text x="624" y="385" font-size="12" class="mute">scikit-learn models and EasyOCR pipelines shipped as usable endpoints</text></g><g class="fu" style="animation-delay:1s"><rect x="560" y="404" width="640" height="46" rx="10" fill="#0e1426" stroke="#22305a"/>
<rect x="560" y="404" width="4" height="46" rx="2" fill="#2ee2f0"/>
<text x="584" y="424" font-size="14" fill="#e7ecf7">“Security is not a product, but a process.”</text>
<text x="584" y="441" font-size="10" letter-spacing="1.5" class="mute">BRUCE SCHNEIER · CLLMSP · SPARKCTF TOP 10 · ACE</text></g>
</svg>
