<radialGradient id="glowA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2ee2f0" stop-opacity=".35"/><stop offset="1" stop-color="#2ee2f0" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c48cfc" stop-opacity=".30"/><stop offset="1" stop-color="#c48cfc" stop-opacity="0"/></radialGradient>
