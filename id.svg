<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Operator ID card and profile dashboard"><title>Operator ID card and profile dashboard</title><desc>ID card with lanyard plus profile stats: repos, CTF results, certifications and focus areas.</desc>
